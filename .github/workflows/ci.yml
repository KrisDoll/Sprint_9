name: Selenoid Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Prepare Selenoid
      run: |
        mkdir -p selenoid
        echo '{
          "chrome": {
            "default": "latest",
            "versions": {
              "latest": {
                "image": "selenoid/chrome:latest",
                "port": "4444",
                "path": "/"
              }
            }
          }
        }' > selenoid/browsers.json

    - name: Pull Selenoid images
      run: |
        docker pull aerokube/selenoid:latest
        docker pull selenoid/chrome:latest
        

    - name: Start Selenoid
      run: docker run -d --name selenoid -p 4444:4444 -v /var/run/docker.sock:/var/run/docker.sock -v $(pwd)/selenoid:/etc/selenoid aerokube/selenoid:latest

    - name: Wait for Selenoid
      run: sleep 10

    - name: Checkout code with test image
      uses: actions/checkout@v4
      with:
        path: 'Diplom'

    - name: Run tests
      run: pytest -v --alluredir=allure-results
      env:
        SELENOID_URL: http://localhost:4444/wd/hub



    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: allure-results