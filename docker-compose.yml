version: '3.8'  # ← Добавляем версию (обязательно!)

services:
  selenoid:
    image: "aerokube/selenoid"
    container_name: selenoid
    ports:
      - "4444:4444"
    networks:
      - selenoid_net  # ← Исправляем на selenoid_net
    volumes:
      - "./selenoid/browsers.json:/etc/browsers.json:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: ["-conf", "/etc/browsers.json", "-container-network", "selenoid_net"]

  selenoid-ui:
    image: "aerokube/selenoid-ui:latest"
    container_name: selenoid-ui
    ports:
      - "8081:8080"
    networks:
      - selenoid_net  # ← Исправляем на selenoid_net
    command: ["--selenoid-uri", "http://selenoid:4444"]

  test_docker:
    build: .  # ← Собираем из Dockerfile
    container_name: test_docker
    depends_on:
      - selenoid
    networks:
      - selenoid_net  # ← Исправляем на selenoid_net
    environment:
      SELENOID_URI: http://selenoid:4444/wd/hub
      BROWSER: chrome
    volumes:
      - ./reports:/app/reports
    command: ["pytest", "-v", "--alluredir=/app/reports/allure-results"]

networks:
  selenoid_net:  # ← Оставляем только это определение
    driver: bridge